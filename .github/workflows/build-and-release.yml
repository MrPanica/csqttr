name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release CSQTT Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK & NDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125"
          fi
          NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "Selected NDK: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Add Android Rust Targets & install cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk

      - name: Build Rust client native libraries
        env:
          RUSTFLAGS: "-A deprecated"
        run: |
          echo "Using NDK: $ANDROID_NDK_HOME"
          cd rust-client
          cargo ndk -t arm64-v8a -P 26 build --release --target-dir ../build/rust-client-android-arm64
          cargo ndk -t armeabi-v7a -P 26 build --release --target-dir ../build/rust-client-android-armv7
          cargo ndk -t x86_64 -P 26 build --release --target-dir ../build/rust-client-android-x86_64
          cd ..
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          cp build/rust-client-android-arm64/aarch64-linux-android/release/client app/src/main/jniLibs/arm64-v8a/libclient.so
          cp build/rust-client-android-armv7/armv7-linux-androideabi/release/client app/src/main/jniLibs/armeabi-v7a/libclient.so
          cp build/rust-client-android-x86_64/x86_64-linux-android/release/client app/src/main/jniLibs/x86_64/libclient.so

      - name: Generate provenance manifest
        shell: pwsh
        run: |
          pwsh -File scripts/native_client_provenance.ps1 -Mode Write
          pwsh -File scripts/native_client_provenance.ps1 -Mode Verify

      - name: Setup release signing keystore
        run: |
          if [ -f "keystore/release.jks" ]; then
            echo "Using tracked release keystore from keystore/release.jks"
            cp keystore/release.jks release.jks
          else
            echo "Fallback: creating release keystore"
            keytool -genkey -v -keystore release.jks -alias csqtt -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass csqttpass123 -keypass csqttpass123 \
              -dname "CN=CSQTT, OU=Android, O=CSQTT, L=Default, ST=Default, C=RU"
          fi
          keytool -list -v -keystore release.jks -storepass csqttpass123

      - name: Build APKs with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PKEYSTORE_FILE=../release.jks \
            -PKEYSTORE_PASSWORD=csqttpass123 \
            -PKEY_ALIAS=csqtt \
            -PKEY_PASSWORD=csqttpass123

      - name: Collect APK artifacts
        run: |
          mkdir -p dist
          TAG_OR_VER="${GITHUB_REF_NAME:-v2.5.3}"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/csqtt-${TAG_OR_VER}-arm64-v8a.apk" || true
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "dist/csqtt-${TAG_OR_VER}-armeabi-v7a.apk" || true
          cp app/build/outputs/apk/release/app-x86_64-release.apk "dist/csqtt-${TAG_OR_VER}-x86_64.apk" || true
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/csqtt-${TAG_OR_VER}-universal.apk" || true
          ls -la dist/

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: csqtt-android-apks
          path: dist/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## CSQTT Rebirth Android ${{ github.ref_name }}

            ### Изменения и сетевые оптимизации:
            - **Повышена отказоустойчивость VK Calls**: до 3 повторных попыток с экспоненциальной задержкой при сетевых глитчах (`connect: no route to host`, таймауты DNS) вместо мгновенного падения в режим капчи.
            - **Защита от изоляции трафика в VPN (`TunVpnService`)**: автоматическое исключение ключевых подсетей VK, серверов звонков OK CDN (`155.212.192.0/20`) и системных DNS (`1.1.1.1`, `8.8.8.8`, `77.88.8.8`) через `excludeRoute` мимо туннеля.
            - **Интерфейс V2 и управление профилями**: улучшенный дизайн (HappControls, V2 BottomBar/TopBar), потокобезопасное энергосбережение, стабильное сохранение SSH-портов и скрытие хешей владельца (апстрим PR #17).
